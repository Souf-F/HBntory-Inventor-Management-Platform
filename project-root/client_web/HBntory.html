document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

208B;display:inline-block;animation:hb-bounce-dot 1.2s infinite;\"><\u002Fspan>\n                <span style=\"width:9px;height:9px;border-radius:50%;background:#17C3D6;display:inline-block;animation:hb-bounce-dot 1.2s infinite .15s;\"><\u002Fspan>\n                <span style=\"width:9px;height:9px;border-radius:50%;background:#F5B700;display:inline-block;animation:hb-bounce-dot 1.2s infinite .3s;\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;\">\n          <sc-for list=\"{{ chips }}\" as=\"chip\" hint-placeholder-count=\"4\">\n            <div style=\"border:3px solid #16130F;background:#fff;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:3px 3px 0 #16130F;\" sc-camel-on-click=\"{{ chip.onClick }}\">{{ chip.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:12px;\">\n          <input type=\"text\" placeholder=\"Écrivez votre question…\" value=\"{{ chatInput }}\" sc-camel-on-change=\"{{ onChatInputChange }}\" sc-camel-on-key-down=\"{{ onChatKeyDown }}\" style=\"flex:1;padding:16px 18px;border:3px solid #16130F;font-size:15px;font-family:'Space Grotesk',sans-serif;background:#fff;\">\n          <div style=\"{{ buttons.send.base }}\" style-hover=\"{{ buttons.send.hover }}\" style-active=\"{{ buttons.send.active }}\" sc-camel-on-click=\"{{ onChatSendClick }}\">Envoyer →<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isProducts }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#16130F;background:#17C3D6;display:inline-block;padding:5px 12px;margin-bottom:14px;\">03 — Produits<\u002Fdiv>\n        <h1 style=\"font-family:'Baloo 2',sans-serif;font-weight:800;font-size:40px;line-height:1.05;margin:0 0 8px;\">Catalogue produits<\u002Fh1>\n        <p style=\"font-size:15px;color:#3a362f;margin:0 0 28px;max-width:600px;\">Consultez les références disponibles et leur stock par branche.<\u002Fp>\n\n        <sc-if value=\"{{ catalogLoading }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:#fff;border:3px solid #16130F;box-shadow:6px 6px 0 #16130F;padding:40px;display:flex;align-items:center;gap:14px;\">\n            <span style=\"width:11px;height:11px;border-radius:50%;background:#7B2FF7;display:inline-block;animation:hb-bounce-dot 1.2s infinite;\"><\u002Fspan>\n            <span style=\"width:11px;height:11px;border-radius:50%;background:#F0208B;display:inline-block;animation:hb-bounce-dot 1.2s infinite .15s;\"><\u002Fspan>\n            <span style=\"width:11px;height:11px;border-radius:50%;background:#F5B700;display:inline-block;animation:hb-bounce-dot 1.2s infinite .3s;\"><\u002Fspan>\n            <span style=\"font-weight:600;margin-left:8px;\">Chargement du catalogue…<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ catalogErrorState }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#FFE8A3;border:3px solid #16130F;box-shadow:6px 6px 0 #16130F;padding:32px;max-width:640px;\">\n            <div style=\"font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;margin-bottom:10px;\">Catalogue indisponible<\u002Fdiv>\n            <p style=\"font-size:14px;line-height:1.5;margin:0 0 20px;\">{{ catalogError }}<\u002Fp>\n            <div style=\"{{ buttons.retry.base }}\" style-hover=\"{{ buttons.retry.hover }}\" style-active=\"{{ buttons.retry.active }}\" sc-camel-on-click=\"{{ onRetryCatalog }}\">Réessayer<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ catalogLoadedState }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-if value=\"{{ catalogEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"color:#777;font-style:italic;\">Aucun produit dans le catalogue.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px;\">\n            <sc-for list=\"{{ catalogCards }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <div style=\"background:#fff;border:3px solid #16130F;box-shadow:6px 6px 0 #16130F;overflow:hidden;\">\n                <div style=\"{{ p.thumbStyle }}\">{{ p.initial }}<\u002Fdiv>\n                <div style=\"padding:16px;\">\n                  <div style=\"font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;margin-bottom:4px;\">{{ p.name }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#777;margin-bottom:10px;\">Réf. {{ p.id }} · {{ p.branch }}<\u002Fdiv>\n                  <div style=\"{{ p.badgeStyle }}\">{{ p.stockLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#fff;background:#7B2FF7;display:inline-block;padding:5px 12px;margin-bottom:14px;\">04 — À propos<\u002Fdiv>\n        <h1 style=\"font-family:'Baloo 2',sans-serif;font-weight:800;font-size:40px;line-height:1.05;margin:0 0 28px;\">À propos de HBntory<\u002Fh1>\n\n        <div style=\"background:#fff;border:3px solid #16130F;box-shadow:8px 8px 0 #16130F;padding:32px;margin-bottom:28px;\">\n          <div style=\"font-family:'Baloo 2',sans-serif;font-weight:700;font-size:20px;margin-bottom:12px;\">Présentation du projet<\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.65;color:#3a362f;margin:0;max-width:760px;\">HBntory est une plateforme de gestion de stock pour un grossiste multi-branches. Le système combine un Backoffice interne (pour gérer le stock et les comptes employés) et cette interface publique, qui permet à n'importe qui de poser des questions sur les produits et leur disponibilité sans avoir besoin de se connecter.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:24px;margin-bottom:28px;\">\n          <div style=\"flex:2 1 380px;background:#F5B700;border:3px solid #16130F;box-shadow:8px 8px 0 #16130F;padding:30px;\">\n            <div style=\"font-family:'Baloo 2',sans-serif;font-weight:700;font-size:19px;margin-bottom:16px;\">Décisions techniques<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;\">\n              <div style=\"display:flex;gap:12px;align-items:flex-start;\"><span style=\"flex:none;width:22px;height:22px;background:#16130F;color:#F5B700;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;\">1<\u002Fspan><span style=\"font-size:14px;line-height:1.55;\">Communication en <strong>REST<\u002Fstrong> plutôt qu'en WebSocket, car chaque question posée au client est traitée indépendamment, sans historique de conversation à maintenir.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:flex-start;\"><span style=\"flex:none;width:22px;height:22px;background:#16130F;color:#F5B700;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;\">2<\u002Fspan><span style=\"font-size:14px;line-height:1.55;\">Authentification par <strong>sessions<\u002Fstrong> (pas de token) pour le Backoffice, avec hachage des mots de passe en <strong>bcrypt<\u002Fstrong>.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:flex-start;\"><span style=\"flex:none;width:22px;height:22px;background:#16130F;color:#F5B700;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;\">3<\u002Fspan><span style=\"font-size:14px;line-height:1.55;\">Autorisations vérifiées <strong>côté serveur<\u002Fstrong>, jamais seulement dans l'interface.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:flex-start;\"><span style=\"flex:none;width:22px;height:22px;background:#16130F;color:#F5B700;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;\">4<\u002Fspan><span style=\"font-size:14px;line-height:1.55;\">Séparation stricte entre les données de stock (stockées localement) et les informations produit (toujours récupérées depuis l'API produit externe, jamais dupliquées en base).<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 260px;background:#7B2FF7;color:#fff;border:3px solid #16130F;box-shadow:8px 8px 0 #16130F;padding:30px;\">\n            <div style=\"font-family:'Baloo 2',sans-serif;font-weight:700;font-size:19px;margin-bottom:14px;\">Travail d'équipe<\u002Fdiv>\n            <p style=\"font-size:14px;line-height:1.6;margin:0;\">Le projet a été réparti en trois pôles complémentaires : la conception de la base de données et son intégration avec l'API produit, l'authentification et la sécurité du Backoffice, et la mise en place de l'agent IA avec son serveur MCP pour répondre aux questions du public.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;margin-bottom:18px;\">L'équipe<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:20px;\">\n          <div style=\"flex:1 1 200px;max-width:260px;background:#fff;border:3px solid #16130F;box-shadow:6px 6px 0 #16130F;padding:20px;position:relative;\">\n            <div style=\"position:absolute;top:0;left:0;width:100%;height:7px;background:#F5B700;\"><\u002Fdiv>\n            <div style=\"font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;\">Sagal-Louise Haider<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 200px;max-width:260px;background:#fff;border:3px solid #16130F;box-shadow:6px 6px 0 #16130F;padding:20px;position:relative;\">\n            <div style=\"position:absolute;top:0;left:0;width:100%;height:7px;background:#17C3D6;\"><\u002Fdiv>\n            <div style=\"font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;\">Noham Oulma<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 200px;max-width:260px;background:#fff;border:3px solid #16130F;box-shadow:6px 6px 0 #16130F;padding:20px;position:relative;\">\n            <div style=\"position:absolute;top:0;left:0;width:100%;height:7px;background:#F0208B;\"><\u002Fdiv>\n            <div style=\"font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;\">Soufiane Filali<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#16130F;background:#FF5A1F;display:inline-block;padding:5px 12px;margin-bottom:14px;\">05 — Contact<\u002Fdiv>\n        <h1 style=\"font-family:'Baloo 2',sans-serif;font-weight:800;font-size:40px;line-height:1.05;margin:0 0 10px;\">Nous contacter<\u002Fh1>\n        <p style=\"font-size:16px;color:#3a362f;max-width:560px;margin:0 0 32px;\">Une question, une suggestion ? Écrivez-nous.<\u002Fp>\n\n        <div style=\"font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;margin:0 0 22px;\">L'équipe<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:32px;\">\n          <div style=\"flex:1 1 300px;max-width:380px;background:#fff;border:3px solid #16130F;box-shadow:8px 8px 0 #16130F;padding:34px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;\">\n            <image-slot id=\"team-sagal\" style=\"width:170px;height:170px;\" shape=\"circle\" placeholder=\"Photo\"><\u002Fimage-slot>\n            <div style=\"font-family:'Baloo 2',sans-se   <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900},\n  &quot;chatApiUrl&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://api.hbntory.exemple.fr/v1/assistant/ask&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Configuration&quot;},\n  &quot;productsApiUrl&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://api.hbntory.exemple.fr/v1/catalogue/produits&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Configuration&quot;},\n  &quot;showDemoSection&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Configuration&quot;}\n}\">\nclass Component extends DCLogic {\n  static CHAT_API_URL = \"https://api.hbntory.exemple.fr/v1/assistant/ask\";\n  static PRODUCTS_API_URL = \"https://api.hbntory.exemple.fr/v1/catalogue/produits\";\n\n  state = {\n    page: \"dashboard\",\n    isMobile: typeof window !== \"undefined\" && window.innerWidth < 860,\n    demoId: \"\",\n    demoRows: [],\n    chatMessages: [],\n    chatInput: \"\",\n    chatLoading: false,\n    catalogState: \"loading\",\n    catalogError: \"\",\n    catalogProducts: []\n  };\n\n  componentDidMount() {\n    this.updateIsMobile = () => this.setState({ isMobile: window.innerWidth < 860 });\n    window.addEventListener(\"resize\", this.updateIsMobile);\n    this.loadCatalog();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"resize\", this.updateIsMobile);\n  }\n\n  goDashboard = () => this.setState({ page: \"dashboard\" });\n  goChat = () => this.setState({ page: \"chat\" });\n  goProducts = () => this.setState({ page: \"products\" });\n  goAbout = () => this.setState({ page: \"about\" });\n  goContact = () => this.setState({ page: \"contact\" });\n\n  makeButton(bg, fg) {\n    return {\n      base: { display: \"inline-flex\", alignItems: \"center\", gap: \"8px\", padding: \"14px 22px\", background: bg, color: fg, border: \"3px solid #16130F\", fontFamily: \"'Baloo 2',sans-serif\", fontWeight: 700, fontSize: \"15px\", textTransform: \"uppercase\", letterSpacing: \".03em\", cursor: \"pointer\", boxShadow: \"5px 5px 0 #16130F\", transition: \"transform .12s ease, box-shadow .12s ease\" },\n      hover: { transform: \"translate(-2px,-2px)\", boxShadow: \"7px 7px 0 #16130F\" },\n      active: { transform: \"translate(1px,1px) scale(0.96)\", boxShadow: \"2px 2px 0 #16130F\" }\n    };\n  }\n\n  navStyle(active, color) {\n    return {\n      display: \"flex\", alignItems: \"center\", gap: \"12px\", padding: \"14px 18px\", border: \"3px solid #16130F\", cursor: \"pointer\",\n      fontFamily: \"'Baloo 2',sans-serif\", fontWeight: 700, fontSize: \"15px\", textTransform: \"uppercase\", letterSpacing: \".02em\",\n      marginBottom: \"14px\", transition: \"transform .15s ease, box-shadow .15s ease\",\n      background: active ? color : \"#FBF1DC\",\n      boxShadow: active ? \"5px 5px 0 #16130F\" : \"3px 3px 0 #16130F\",\n      transform: active ? \"translate(-2px,-2px)\" : \"none\"\n    };\n  }\n\n  tabStyle(active, color) {\n    return {\n      display: \"flex\", flexDirection: \"column\", alignItems: \"center\", justifyContent: \"center\", gap: \"3px\",\n      flex: 1, cursor: \"pointer\", color: active ? color : \"#16130F\", fontWeight: 700\n    };\n  }\n\n  generateProductName(id) {\n    const ADJ = [\"Ultra\", \"Nova\", \"Prime\", \"Éco\", \"Turbo\", \"Méga\", \"Néo\", \"Vif\", \"Rapide\", \"Solide\"];\n    const NOUN = [\"Module\", \"Capteur\", \"Kit\", \"Support\", \"Boîtier\", \"Adaptateur\", \"Câble\", \"Panneau\", \"Filtre\", \"Unité\"];\n    const s = String(id);\n    let hash = 0;\n    for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;\n    return ADJ[hash % ADJ.length] + \" \" + NOUN[Math.floor(hash / 7) % NOUN.length] + \" \" + s;\n  }\n\n  pickBranch(id) {\n    const BRANCHES = [\"Paris\", \"Lyon\", \"Marseille\", \"Toulouse\", \"Bordeaux\", \"Lille\", \"Nantes\", \"Strasbourg\"];\n    const s = String(id) + \"b\";\n    let hash = 0;\n    for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;\n    return BRANCHES[hash % BRANCHES.length];\n  }\n\n  pickStock(id) {\n    const s = String(id) + \"s\";\n    let hash = 0;\n    for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;\n    return hash % 120;\n  }\n\n  onDemoIdChange = (e) => this.setState({ demoId: e.target.value });\n  onDemoKeyDown = (e) => { if (e.key === \"Enter\") this.onDemoAdd(); };\n  onDemoAdd = () => {\n    const id = this.state.demoId.trim();\n    if (!id) return;\n    const row = { id, name: this.generateProductName(id), branch: this.pickBranch(id), stock: this.pickStock(id), addedAt: new Date().toLocaleTimeString(\"fr-FR\", { hour: \"2-digit\", minute: \"2-digit\", second: \"2-digit\" }) };\n    this.setState((s) => ({ demoRows: [row, ...s.demoRows], demoId: \"\" }));\n  };\n\n  onChatInputChange = (e) => this.setState({ chatInput: e.target.value });\n  onChatKeyDown = (e) => { if (e.key === \"Enter\" && !e.shiftKey) { e.preventDefault(); this.handleSend(); } };\n  onChatSendClick = () => this.handleSend();\n\n  handleSend = async (question) => {\n    const q = (question !== undefined ? question : this.state.chatInput).trim();\n    if (!q || this.state.chatLoading) return;\n    const url = this.props.chatApiUrl || Component.CHAT_API_URL;\n    this.setState((s) => ({ chatMessages: [...s.chatMessages, { role: \"user\", text: q }], chatInput: \"\", chatLoading: true }));\n    try {\n      const ctrl = new AbortController();\n      const timeoutId = setTimeout(() => ctrl.abort(), 9000);\n      const res = await fetch(url, { method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: JSON.stringify({ question: q }), signal: ctrl.signal });\n      clearTimeout(timeoutId);\n      if (!res.ok) throw new Error(\"HTTP \" + res.status);\n      const data = await res.json();\n      const answer = (data && (data.answer || data.response || data.message)) || \"Réponse reçue.\";\n      this.setState((s) => ({ chatMessages: [...s.chatMessages, { role: \"assistant\", text: answer }], chatLoading: false }));\n    } catch (err) {\n      this.setState((s) => ({ chatMessages: [...s.chatMessages, { role: \"error\", text: \"L'assistant HBntory ne répond pas pour le moment. Merci de réessayer dans un instant.\" }], chatLoading: false }));\n    }\n  };\n\n  loadCatalog = async () => {\n    const url = this.props.productsApiUrl || Component.PRODUCTS_API_URL;\n    this.setState({ catalogState: \"loading\", catalogError: \"\" });\n    try {\n      const ctrl = new AbortController();\n      const timeoutId = setTimeout(() => ctrl.abort(), 9000);\n      const res = await fetch(url, { signal: ctrl.signal });\n      clearTimeout(timeoutId);\n      if (!res.ok) throw new Error(\"HTTP \" + res.status);\n      const data = await res.json();\n      const list = Array.isArray(data) ? data : (data.products || data.items || []);\n      this.setState({ catalogState: \"loaded\", catalogProducts: list });\n    } catch (err) {\n      this.setState({ catalogState: \"error\", catalogError: \"Le service catalogue est momentanément indisponible. Vérifiez la connexion ou réessayez.\" });\n    }\n  };\n  onRetryCatalog = () => this.loadCatalog();\n\n  renderVals() {\n    const s = this.state;\n    const isMobile = s.isMobile;\n    const isDesktop = !isMobile;\n\n    const palette = [\"#F0208B\", \"#17C3D6\", \"#F5B700\", \"#FF5A1F\", \"#7B2FF7\"];\n    const catalogCards = (s.catalogProducts || []).map((p, i) => {\n      const stock = p.stock || 0;\n      return {\n        id: p.id, name: p.name || \"Produit\", branch: p.branch || \"—\",\n        initial: (p.name || \"?\").charAt(0).toUpperCase(),\n        thumbStyle: { height: \"96px\", display: \"flex\", alignItems: \"center\", justifyContent: \"center\", fontFamily: \"'Baloo 2',sans-serif\", fontWeight: 800, fontSize: \"34px\", color: \"#fff\", background: palette[i % palette.length] },\n        stockLabel: stock > 10 ? (\"En stock (\" + stock + \")\") : (stock > 0 ? (\"Stock faible (\" + stock + \")\") : \"Rupture de stock\"),\n        badgeStyle: { display: \"inline-block\", padding: \"4px 10px\", fontSize: \"12px\", fontWeight: 700, border: \"2px solid #16130F\", background: stock > 10 ? \"#C9F2D6\" : (stock > 0 ? \"#FFE8A3\" : \"#FFD0D8\") }\n      };\n    });\n\n    const chatBubbles = s.chatMessages.map((m, i) => {\n      const isUser = m.role === \"user\";\n      const isError = m.role === \"error\";\n      return {\n        key: i,\n        text: m.text,\n        label: isUser ? \"Vous\" : (isError ? \"Erreur\" : \"Assistant HBntory\"),\n        wrapStyle: { display: \"flex\", justifyContent: isUser ? \"flex-end\" : \"flex-start\" },\n        bubbleStyle: {\n          maxWidth: \"70%\", padding: \"14px 18px\", border: \"3px solid \" + (isError ? \"#E11D48\" : \"#16130F\"),\n          boxShadow: \"3px 3px 0 #16130F\",\n          background: isUser ? \"#7B2FF7\" : (isError ? \"#FFE8A3\" : \"#fff\"),\n          color: isUser ? \"#fff\" : \"#16130F\"\n        }\n      };\n    });\n\n    const chips = [\n      { label: \"Où puis-je trouver le produit X ?\", onClick: () => this.handleSend(\"Où puis-je trouver le produit X ?\") },\n      { label: \"Quels produits sont disponibles dans la branche Y ?\", onClick: () => this.handleSend(\"Quels produits sont disponibles dans la branche Y ?\") },\n      { label: \"Il me faut 3 unités de X, 2 de Y et 4 de Z, dans quelle(s) branche(s) puis-je tout trouver ?\", onClick: () => this.handleSend(\"Il me faut 3 unités de X, 2 de Y et 4 de Z, dans quelle(s) branche(s) puis-je tout trouver ?\") },\n      { label: \"Donne-moi les détails du produit XX\", onClick: () => this.handleSend(\"Donne-moi les détails du produit XX\") }\n    ];\n\n    return {\n      isMobile, isDesktop,\n      isDashboard: s.page === \"dashboard\", isChat: s.page === \"chat\", isProducts: s.page === \"products\", isAbout: s.page === \"about\", isContact: s.page === \"contact\",\n      goDashboard: this.goDashboard, goChat: this.goChat, goProducts: this.goProducts, goAbout: this.goAbout, goContact: this.goContact,\n      navStyles: { dashboard: this.navStyle(s.page === \"dashboard\", \"#F5B700\"), chat: this.navStyle(s.page === \"chat\", \"#F0208B\"), products: this.navStyle(s.page === \"products\", \"#17C3D6\"), about: this.navStyle(s.page === \"about\", \"#7B2FF7\"), contact: this.navStyle(s.page === \"contact\", \"#FF5A1F\") },\n      tabStyles: { dashboard: this.tabStyle(s.page === \"dashboard\", \"#F5B700\"), chat: this.tabStyle(s.page === \"chat\", \"#F0208B\"), products: this.tabStyle(s.page === \"products\", \"#17C3D6\"), about: this.tabStyle(s.page === \"about\", \"#7B2FF7\"), contact: this.tabStyle(s.page === \"contact\", \"#FF5A1F\") },\n      mainWrapStyle: { marginLeft: isDesktop ? \"260px\" : \"0\", padding: isMobile ? \"76px 20px 90px\" : \"48px 56px\", position: \"relative\", zIndex: 1, minHeight: \"100vh\" },\n      buttons: {\n        chat: this.makeButton(\"#FFFFFF\", \"#7B2FF7\"),\n        products: this.makeButton(\"#FFFFFF\", \"#16130F\"),\n        add: this.makeButton(\"#F5B700\", \"#16130F\"),\n        send: this.makeButton(\"#F0208B\", \"#FFFFFF\"),\n        retry: this.makeButton(\"#16130F\", \"#FBF1DC\")\n      },\n      showDemo: this.props.showDemoSection ?? true,\n      demoId: s.demoId, onDemoIdChange: this.onDemoIdChange, onDemoKeyDown: this.onDemoKeyDown, onDemoAdd: this.onDemoAdd,\n      demoRows: s.demoRows, noDemoRows: s.demoRows.length === 0,\n      chatPanelStyle: { flex: 1, overflowY: \"auto\", background: \"#fff\", border: \"3px solid #16130F\", boxShadow: \"6px 6px 0 #16130F\", padding: \"22px\", display: \"flex\", flexDirection: \"column\", gap: \"14px\", marginBottom: \"16px\", height: isMobile ? \"calc(100vh - 250px)\" : \"calc(100vh - 180px)\", minHeight: \"440px\" },\n      chatBubbles, noChatMessages: s.chatMessages.length === 0 && !s.chatLoading,\n      chatLoading: s.chatLoading, chips,\n      chatInput: s.chatInput, onChatInputChange: this.onChatInputChange, onChatKeyDown: this.onChatKeyDown, onChatSendClick: this.onChatSendClick,\n      catalogLoading: s.catalogState === \"loading\", catalogErrorState: s.catalogState === \"error\", catalogLoadedState: s.catalogState === \"loaded\",\n      catalogError: s.catalogError, catalogEmpty: catalogCards.length === 0, catalogCards, onRetryCatalog: this.onRetryCatalog\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
